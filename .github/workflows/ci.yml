name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r api/flask_app/requirements.txt

      - name: Run pytest
        run: >
          python -m pytest api/flask_app/tests -v
          --cov=api.flask_app --cov=core
          --cov-report=term-missing --cov-fail-under=80
