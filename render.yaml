services:
  - name: lawbot-api
    type: web
    runtime: docker
    dockerfilePath: ./api/flask_app/Dockerfile
    dockerContext: .
    # Free tier: spins down after 15 min idle, ~30-60s cold start on the
    # next request. Fine for the web UI (just a slower first response);
    # a LINE message arriving while asleep may exceed LINE's delivery
    # timeout and be treated as a failed webhook. Bump to "starter"
    # ($7/mo) later if that becomes a real problem.
    plan: free
    healthCheckPath: /auth/me
    envVars:
      # Postgres is hosted on Neon (neon.tech)
      # Paste the Neon connection string here manually.
      - key: SQLALCHEMY_DATABASE_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CHANNEL_SECRET
        sync: false
      - key: CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
      - key: LINE_LOGIN_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EXAM_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
